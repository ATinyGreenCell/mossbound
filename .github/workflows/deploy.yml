name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The e2e suite drives a real Chrome, and the online groups need live Nostr relays and MQTT
  # brokers. A phone can't run that and neither can the sandbox the builds come from, so this is
  # the only place it runs — and it has to run before anything is published, not after.
  #
  # It runs in four shards on four runners rather than as one block. A runner has two cores and no
  # GPU, so the whole suite in one place takes half an hour of software rendering, and half an hour
  # between pushing and seeing the site live is long enough that the gate starts to feel like
  # something to route around. Split, the slowest shard decides.
  #
  # Which tests are in which shard is worked out by run.mjs from its own list, not written out
  # here: a hand-kept list of group names in a workflow file is a list that loses one, and a lost
  # group is a test that quietly stops running while this still reports green. (Writing it out by
  # hand had already dropped `sprouts` before the first run.)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest ships Chrome; fail loudly rather than silently skipping the suite
      - name: Find Chrome
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$c" ]; then echo "CHROME_PATH=$c" >> "$GITHUB_ENV"; echo "using $c"; exit 0; fi
          done
          echo "::error::no Chrome on the runner — the e2e suite cannot run"; exit 1
      # The runner has no GPU, which the harness already has a path for (SwiftShader: slower, same
      # results). A failure is retried once, and only for the groups that failed — the online ones
      # pair through public relays, so a broker having a bad minute is not a reason to block a
      # publish. Anything that fails twice does block it.
      - name: End-to-end suite
        env:
          E2E_SWIFTSHADER: '1'
          # Every waitFor timeout × 6. The figures in the suite were written against a machine with
          # a GPU; this runner has none and draws a few frames a second, so they were giving up on
          # things that had not happened YET and calling it a failure. A timeout costs nothing when
          # the condition is already true, so this slows nothing down and weakens no assertion.
          E2E_SLOW: '6'
        run: |
          set -o pipefail
          if npm run test:e2e -- --shard ${{ matrix.shard }}/4 2>&1 | tee /tmp/e2e.log; then exit 0; fi
          failed=$(sed -n 's/^FAIL  *\([A-Za-z0-9-]*\).*/\1/p' /tmp/e2e.log | sort -u | paste -sd, -)
          if [ -z "$failed" ]; then echo "::error::the shard failed before any test ran"; exit 1; fi
          echo "::warning::retrying once: $failed"
          npm run test:e2e -- --only "$failed" 2>&1 | tee /tmp/e2e-retry.log
      # Why a run failed has to be readable from wherever the next change is being written, and a
      # sandbox can reach api.github.com but not the Actions web pages or the blob store the logs
      # and artifacts actually live in. A step summary comes back through the plain API, so it is
      # the one place a failure can be put and still be found. Everything needed to act on a
      # failure goes here: which groups failed, and the tail of each one's own log.
      # Why a run failed has to be readable from wherever the next change gets written, and a
      # sandbox can reach api.github.com but not the Actions web pages or the blob store that the
      # logs and artifacts actually live in — both answer 403. So the reason goes out twice, by the
      # two routes that do come back through the plain API:
      #
      #   ::error:: annotations, which are the proven one (reading the group names off a `retrying`
      #   warning is how the first failure was identified at all), and
      #   the step summary, which has room for the whole tail of each failed log.
      - name: Why it failed
        if: failure()
        run: |
          logs="/tmp/e2e-retry.log /tmp/e2e.log"
          names=$(sed -n 's/^FAIL  *\([A-Za-z0-9-]*\).*/\1/p' $logs 2>/dev/null | sort -u)
          if [ -z "$names" ]; then
            echo "::error::shard ${{ matrix.shard }}/4 failed before any test ran"
          else
            echo "::error::shard ${{ matrix.shard }}/4 failed: $(echo "$names" | paste -sd, -)"
          fi
          {
            echo "## shard ${{ matrix.shard }}/4 failed"
            echo
            echo '### first run'
            echo '```'
            grep -hE '^(PASS|FAIL|shard |[0-9]+/[0-9]+ passed)' /tmp/e2e.log 2>/dev/null | head -40
            echo '```'
            if [ -s /tmp/e2e-retry.log ]; then
              echo '### retry'
              echo '```'
              grep -hE '^(PASS|FAIL|shard |[0-9]+/[0-9]+ passed)' /tmp/e2e-retry.log 2>/dev/null | head -40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          for n in $names; do
            f="tests/e2e/.out/logs/$n.log"
            [ -f "$f" ] || continue
            # The checks that actually failed, and whatever the page threw — NOT a blind tail. A
            # test prints a line per check, so in a long one the failing line has scrolled a
            # hundred lines off the end by the time it finishes, and a tail shows only the errors
            # block. These two are the whole of what is needed to act on a failure.
            said=$( { grep -E '^FAIL' "$f" | head -n 12
                      sed -n '/^--- errors ---/,$p' "$f" | grep -vx 'none' | head -n 12; } )
            [ -n "$said" ] || said=$(tail -n 8 "$f")
            echo "::error title=$n::$(printf '%s' "$said" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            {
              echo
              echo "<details><summary>$n</summary>"
              echo
              echo '```'
              printf '%s\n' "$said"
              echo
              echo '--- last 60 lines ---'
              tail -n 60 "$f"
              echo '```'
              echo
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-shard-${{ matrix.shard }}
          path: tests/e2e/.out/
          # .out is a hidden directory, and v4 drops hidden files unless told not to — without this
          # the upload reports success and uploads nothing, which is worse than failing
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
