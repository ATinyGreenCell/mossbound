<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2b4a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="__GAME_NAME__" />
    <meta name="description" content="Two little sprouts, one vine. A co-op platformer for two players on their own phones, laptops or controllers." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- the three Fredoka weights the game uses (see main.ts), fetched alongside the script rather than after it has run -->
    <link rel="preload" href="/node_modules/@fontsource/fredoka/files/fredoka-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- the game's name, in this title and above, comes from src/brand.ts (vite.config.ts) -->
    <title>__GAME_NAME__</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
